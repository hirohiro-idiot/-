<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141827"><title>My Timer Game</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><span class="eyebrow">MY TIMER GAME · v0.1</span><h1>カスタム・セッション</h1><p>自分好みのイベントを組み立てられる、シンプルなタイマーゲーム</p></header><section class="panel center" aria-live="polite"><div class="eyebrow" id="phase">READY</div><div class="timer" id="timer">10:00</div><div class="event" id="event">準備完了</div><div class="hint" id="hint">設定を選んでスタート</div><div class="actions"><button id="start" class="primary">スタート</button><button id="reset">リセット</button><button id="next">次のイベント</button></div></section><section class="panel"><h2>ゲーム設定</h2><label for="difficulty">難易度</label><select id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select><label for="minutes">セッション時間 <output id="minutesLabel">10分</output></label><input type="range" id="minutes" min="5" max="30" step="5" value="10"><label class="check"><input id="speech" type="checkbox">イベントを音声で読み上げる</label><label class="check"><input id="sound" type="checkbox" checked>イベント時に通知音を鳴らす</label><p class="note">設定はこの端末のブラウザに保存されます。実行中の時間変更は次のリセット時に反映します。</p></section><section class="panel"><h2>イベント編集</h2><p class="note">1行につき1つ。ここに好きな指示を書いてください。イベントはランダムに選ばれます。</p><textarea id="events" rows="7" spellcheck="false"></textarea><div class="actions"><button id="saveEvents">イベントを保存</button><button id="restoreEvents">初期値に戻す</button></div><p id="message" class="note" role="status"></p></section><footer>GitHub Pages対応 · サーバー不要 · データは端末内に保存</footer></main><script src="config/texts.js" defer></script><script src="config/audio.js" defer></script><script src="audio-player.js" defer></script><script src="app.js" defer></script></body></html>
